version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: password_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: password_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redpass_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: redpass_app
    restart: always
    ports:
      - "80:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/password_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis