<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redpass — Проверка надежности</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-gray-900 min-h-screen transition-colors duration-300 font-sans text-slate-900 dark:text-slate-100">

    <nav class="max-w-5xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <span class="text-2xl font-black tracking-tighter uppercase">Red<span class="text-red-600">pass</span></span>
        </div>
        <button id="theme-toggle" class="p-2 rounded-xl bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 shadow-sm transition-all">
            <svg class="w-6 h-6 text-slate-600 dark:text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </nav>

    <main class="max-w-xl mx-auto px-6 space-y-8">

    <!-- Секция авторизации -->
        <h2 class="text-xl font-bold text-center">Вход в систему</h2>
        <div id="auth-error" class="hidden bg-red-100 text-red-700 p-3 rounded-lg text-sm text-center"></div>

        <div class="space-y-4">
            <input type="email" id="email" class="w-full px-4 py-3 bg-slate-50 dark:bg-gray-900 border border-slate-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-red-500" placeholder="Email">
            <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 dark:bg-gray-900 border border-slate-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-red-500" placeholder="Пароль">
            <div class="flex gap-4">
                <button id="btn-login" class="w-full py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition-all">Войти</button>
                <button id="btn-register" class="w-full py-3 border border-red-600 text-red-600 rounded-xl font-bold hover:bg-red-50 transition-all">Регистрация</button>
            </div>
        </div>
    </div>

    <!-- Основной интерфейс приложения -->
    <div id="app-section" class="hidden space-y-6">
        <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
            <span id="user-email-display" class="font-medium text-gray-700">user@mail.com</span>
            <button id="btn-logout" class="text-sm text-red-600 hover:underline">Выйти</button>
        </div>

        <div class="bg-white p-8 rounded-xl shadow-lg space-y-4">
            <h2 class="text-xl font-bold">Проверка пароля</h2>
            <div class="flex space-x-2">
                <input type="text" id="check-password-input"
                       class="block w-full px-3 py-2 border border-red-200 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                       placeholder="Введите пароль для проверки...">
                <button id="btn-check"
                        class="py-2 px-6 bg-red-600 hover:bg-red-700 text-white rounded-md font-medium shadow-sm transition-colors">
                    Проверить
                </button>
            </div>

            <div id="strength-preview" class="space-y-2">
                <div class="flex items-center justify-between text-xs text-gray-600">
                    <span>Предварительная стойкость</span>
                    <span id="strength-label">Начните вводить пароль</span>
                </div>
                <div class="h-2 w-full rounded-full bg-gray-200 overflow-hidden">
                    <div id="strength-bar" class="h-2 w-0 bg-gray-400 transition-all duration-200"></div>
                </div>
            </div>

            <div id="check-result" class="hidden mt-6 p-4 border rounded-lg bg-gray-50">
                <h3 class="font-bold mb-2">Результат:</h3>
                <p class="text-sm">Оценка: <span id="res-score" class="font-bold"></span> / 4</p>
                <p class="text-sm">Время взлома: <span id="res-time" class="font-bold"></span></p>
                <p class="text-sm mt-2 font-bold" id="res-leak"></p>
            </div>
        </div>

        <!-- История -->
        <div class="bg-white p-8 rounded-xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">История проверок</h2>
                <div class="flex space-x-4">
                    <button id="btn-clear-history" class="text-sm text-gray-500 hover:text-red-600 transition-colors">Очистить</button>
                    <button id="btn-refresh-history" class="text-sm text-red-700 hover:underline">Обновить</button>
                </div>
            </div>
            <div class="overflow-hidden shadow ring-1 ring-black ring-opacity-5 rounded-lg">
                <table class="min-w-full divide-y divide-gray-300">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Пароль</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Оценка</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Утечки</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Кнопка навигации на генератор -->
        <div class="text-center pb-10">
            <a href="/generator" class="inline-flex items-center gap-2 font-bold text-red-600 hover:scale-105 transition-transform">
            Нужен новый надежный пароль?
            <span class="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center">→</span>
            </span>
        </a>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
