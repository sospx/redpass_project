<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redpass — Проверка надежности</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-gray-900 min-h-screen transition-colors duration-300 font-sans text-slate-900 dark:text-slate-100">

    <nav class="max-w-5xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <span class="text-2xl font-black tracking-tighter uppercase">Red<span class="text-red-600">pass</span></span>
        </div>
        <button id="theme-toggle" class="p-2 rounded-xl bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 shadow-sm transition-all">
            <svg class="w-6 h-6 text-slate-600 dark:text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </nav>

    <main class="max-w-xl mx-auto px-6 space-y-8">
        <div id="auth-section" class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl border border-slate-100 dark:border-gray-700 space-y-6">
            <h2 class="text-xl font-bold text-center">Вход в систему</h2>
            <div id="auth-error" class="hidden bg-red-100 text-red-700 p-3 rounded-lg text-sm text-center"></div>
            <div class="space-y-4">
                <input type="email" id="email" class="w-full px-4 py-3 bg-slate-50 dark:bg-gray-900 border border-slate-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-red-500" placeholder="Email">
                <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 dark:bg-gray-900 border border-slate-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-red-500" placeholder="Пароль">
                <div class="flex gap-4">
                    <button id="btn-login" class="w-full py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition-all">Войти</button>
                    <button id="btn-register" class="w-full py-3 border border-red-600 text-red-600 rounded-xl font-bold hover:bg-red-50 transition-all">Регистрация</button>
                </div>
            </div>
        </div>

        <div id="app-section" class="hidden space-y-6">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow flex justify-between items-center border border-slate-100 dark:border-gray-700">
                <span id="user-email-display" class="font-medium text-slate-600 dark:text-slate-300"></span>
                <button id="btn-logout" class="text-sm text-red-600 font-bold hover:underline">Выйти</button>
            </div>

            <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl border border-slate-100 dark:border-gray-700 space-y-6">
                <div class="relative">
                    <input type="text" id="check-password-input" class="w-full px-5 py-4 bg-slate-50 dark:bg-gray-900 border border-slate-200 dark:border-gray-700 rounded-2xl focus:ring-2 focus:ring-red-500 outline-none pr-32 transition-all dark:text-white" placeholder="Ваш пароль...">
                    <button id="btn-check" class="absolute right-2 top-2 bottom-2 px-6 bg-red-600 text-white rounded-xl font-bold text-sm hover:bg-red-700 transition-all">ПРОВЕРИТЬ</button>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-xs font-bold uppercase tracking-widest text-slate-400">
                        <span>Стойкость</span>
                        <span id="strength-label">Ожидание</span>
                    </div>
                    <div class="h-2 w-full bg-slate-100 dark:bg-gray-700 rounded-full overflow-hidden">
                        <div id="strength-bar" class="h-full w-0 bg-slate-400 transition-all duration-300"></div>
                    </div>
                </div>

                <div id="check-result" class="hidden p-5 rounded-2xl bg-slate-50 dark:bg-gray-900 border border-slate-100 dark:border-gray-700 text-sm space-y-2">
                    <p>Оценка: <span id="res-score" class="font-bold text-red-600"></span> / 4</p>
                    <p>Время взлома: <span id="res-time" class="font-bold text-red-600"></span></p>
                    <p id="res-leak" class="mt-2 font-bold"></p>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-xl border border-slate-100 dark:border-gray-700">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold">История проверок</h2>
                    <div class="flex gap-4">
                        <button id="btn-clear-history" class="text-xs text-slate-400 hover:text-red-600 font-bold uppercase transition-colors">Очистить</button>
                        <button id="btn-refresh-history" class="text-xs text-red-600 font-bold uppercase hover:underline">Обновить</button>
                    </div>
                </div>
                <div class="overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="text-xs font-bold text-slate-400 uppercase border-b border-slate-100 dark:border-gray-700">
                            <tr>
                                <th class="pb-3 px-2">Пароль</th>
                                <th class="pb-3 px-2">Счет</th>
                                <th class="pb-3 px-2 text-right">Статус</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="divide-y divide-slate-50 dark:divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center pb-10">
            <a href="/generator" class="inline-flex items-center gap-2 font-bold text-red-600 hover:scale-105 transition-transform">
                Нужен новый надежный пароль?
                <span class="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center">→</span>
            </a>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
