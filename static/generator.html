<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redpass - Генератор паролей</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <!-- Кнопка навигации -->
    <div class="fixed top-6 left-6">
        <a href="/" class="group flex items-center gap-2 py-2 px-4 bg-white/80 backdrop-blur-sm border border-red-200 text-red-700 hover:bg-red-600 hover:text-white font-medium rounded-full shadow-sm transition-all duration-300">
            <svg class="h-4 w-4 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span>К проверке</span>
        </a>
    </div>

    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg text-center space-y-6 border border-red-200">
        <h1 class="text-3xl font-extrabold text-red-700">Генератор паролей</h1>
        <p class="text-sm text-red-600">Надёжные пароли одним нажатием</p>

        <div class="mt-4">
            <div class="bg-red-50 border border-red-200 p-4 rounded-lg font-mono text-xl break-all" id="passwordDisplay">
                Нажмите «Сгенерировать»
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button id="generateBtn" class="py-2 px-6 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg shadow transition">
                Сгенерировать
            </button>
            <button id="copyBtn" class="py-2 px-6 border border-red-600 text-red-700 bg-white hover:bg-red-50 font-medium rounded-lg shadow transition">
                Скопировать
            </button>
        </div>

        <p id="copyMessage" class="text-sm text-green-600 h-6"></p>
    </div>

    <script>
        const passwordDisplay = document.getElementById('passwordDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyMessage = document.getElementById('copyMessage');

        function generatePassword() {
            const length = 14;
            const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const lower = 'abcdefghijkmnopqrstuvwxyz';
            const digits = '23456789';
            const symbols = '!@#$%^&*()_+';

            let chars = upper + lower + digits + symbols;
            let password = '';

            password += upper[Math.floor(Math.random() * upper.length)];
            password += lower[Math.floor(Math.random() * lower.length)];
            password += digits[Math.floor(Math.random() * digits.length)];
            password += symbols[Math.floor(Math.random() * symbols.length)];

            for (let i = password.length; i < length; i++) {
                password += chars[Math.floor(Math.random() * chars.length)];
            }

            password = password.split('').sort(() => Math.random() - 0.5).join('');
            return password;
        }

        async function copyToClipboard() {
            const password = passwordDisplay.innerText;
            if (!password || password === 'Нажмите «Сгенерировать»') {
                copyMessage.innerText = 'Сначала сгенерируйте пароль';
                setTimeout(() => copyMessage.innerText = '', 1500);
                return;
            }

            try {
                await navigator.clipboard.writeText(password);
                copyMessage.innerText = 'Пароль скопирован!';
                setTimeout(() => copyMessage.innerText = '', 1500);
            } catch (err) {
                copyMessage.innerText = 'Не удалось скопировать';
                setTimeout(() => copyMessage.innerText = '', 1500);
            }
        }

        generateBtn.addEventListener('click', () => {
            passwordDisplay.innerText = generatePassword();
        });

        copyBtn.addEventListener('click', copyToClipboard);
    </script>
</body>
</html>
