<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redpass — Генератор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-gray-900 min-h-screen transition-colors duration-300 font-sans flex flex-col">

    <nav class="max-w-5xl mx-auto w-full px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <span class="text-2xl font-black tracking-tighter uppercase dark:text-white">Red<span class="text-red-600">pass</span></span>
        </div>
        <button id="theme-toggle" class="p-2 rounded-xl bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 shadow-sm transition-all">
            <svg class="w-6 h-6 text-slate-600 dark:text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl border border-slate-100 dark:border-gray-700 space-y-6">
            <h1 class="text-xl font-bold text-center dark:text-white">Генератор паролей</h1>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-red-600 uppercase tracking-widest ml-1">Ключевое слово:</label>
                <input type="text" id="keywordInput" maxlength="20"
                       class="w-full px-4 py-3 bg-slate-50 dark:bg-gray-900 border border-slate-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-red-500 transition-all dark:text-white"
                       placeholder="Например: apple">
            </div>

            <div id="passwordDisplay" class="bg-slate-50 dark:bg-gray-900 border-2 border-dashed border-slate-200 dark:border-gray-700 p-6 rounded-2xl font-mono text-xl text-red-600 break-all min-h-[80px] flex items-center justify-center">
                ••••••••••••••••
            </div>

            <div class="space-y-3">
                <button id="generateBtn" class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95 uppercase tracking-wide">
                    Создать пароль
                </button>
                <button id="copyBtn" class="w-full py-3 border border-slate-200 dark:border-gray-700 dark:text-slate-300 font-bold rounded-2xl hover:bg-slate-50 dark:hover:bg-gray-700 transition-all flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    Копировать
                </button>
            </div>

            <p id="copyMessage" class="text-sm text-green-500 font-medium h-4 text-center"></p>
            <a href="/" class="block text-center text-slate-400 hover:text-red-600 font-bold text-xs uppercase tracking-widest transition-colors pt-2">← К проверке</a>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });

        const passwordDisplay = document.getElementById('passwordDisplay');
        const keywordInput = document.getElementById('keywordInput');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyMessage = document.getElementById('copyMessage');

        const charset = {
            upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
            lower: 'abcdefghijkmnopqrstuvwxyz',
            digits: '23456789',
            symbols: '!@#$%^&*()_+'
        };

        const getRandom = (str) => str[Math.floor(Math.random() * str.length)];

        function leetify(word) {
            const rules = { 'a': '@', 'e': '3', 'i': '1', 'o': '0', 's': '$', 't': '7', 'b': '8' };
            return word.split('').map(c => (rules[c.toLowerCase()] && Math.random() < 0.6) ? rules[c.toLowerCase()] : c).join('');
        }

        function generateSecurePassword(keyword) {
            let base = keyword ? leetify(keyword.trim()) : "";
            const minTotalLength = 16;
            let securePrefix = getRandom(charset.upper) + getRandom(charset.symbols) + getRandom(charset.digits);
            let secureSuffix = getRandom(charset.digits) + getRandom(charset.symbols) + getRandom(charset.upper);

            let result = Math.random() > 0.5
                ? securePrefix + base + secureSuffix
                : base.slice(0, Math.floor(base.length/2)) + securePrefix + secureSuffix + base.slice(Math.floor(base.length/2));

            const allChars = Object.values(charset).join('');
            while (result.length < minTotalLength) {
                result += getRandom(allChars);
            }
            if (!/[!@#$%^&*()_+]/.test(result)) result += getRandom(charset.symbols);
            return result;
        }

        generateBtn.addEventListener('click', () => {
            passwordDisplay.innerText = generateSecurePassword(keywordInput.value);
        });

        copyBtn.addEventListener('click', async () => {
            const pass = passwordDisplay.innerText;
            if (pass.includes('•')) return;
            try {
                await navigator.clipboard.writeText(pass);
                copyMessage.innerText = 'Пароль скопирован!';
                setTimeout(() => copyMessage.innerText = '', 2000);
            } catch (e) {}
        });
    </script>
</body>
</html>
