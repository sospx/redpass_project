<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redpass — Генератор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0D0D0D',
                        brandCard: '#141414',
                    }
                }
            }
        }
        if (localStorage.theme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-brandDark text-slate-900 dark:text-slate-100 min-h-screen font-sans flex flex-col justify-between transition-colors duration-300">

    <!-- Навигация -->
    <nav class="max-w-xl mx-auto w-full px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 bg-red-600 rounded-xl flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <span class="text-xl font-black tracking-tighter uppercase">Red<span class="text-red-600">pass</span></span>
        </div>

        <!-- Кнопка темы -->
        <button id="theme-toggle" class="p-2 rounded-xl bg-white dark:bg-brandCard border border-slate-200 dark:border-white/10 text-slate-600 dark:text-red-500 hover:scale-105 transition-all shadow-sm">
            <svg id="theme-icon-dark" class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 2.293a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM16 10a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1zM14.707 14.707a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.293 14.707a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM4 10a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zM5.293 5.293a1 1 0 010-1.414l.707-.707a1 1 0 111.414 1.414l-.707.707a1 1 0 01-1.414 0zM10 5a5 5 0 100 10 5 5 0 000-10z"></path></svg>
            <svg id="theme-icon-light" class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </nav>

    <!-- Генератор -->
    <main class="flex-1 flex items-center justify-center p-6 w-full">
        <div class="max-w-md w-full space-y-4">

            <!-- СТРЕЛОЧКА ОБРАТНО НА СТРАНИЦУ ПРОВЕРКИ -->
            <div class="flex justify-start pl-2">
                <a href="/" class="text-xs font-bold text-red-600 dark:text-red-500 hover:text-red-700 dark:hover:text-red-400 flex items-center gap-1 transition-all hover:-translate-x-1">
                    ← Вернуться к проверке пароля
                </a>
            </div>

            <div class="bg-white dark:bg-brandCard p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-white/5 space-y-6">
                <div class="space-y-1 text-center">
                    <h1 class="text-xl font-extrabold tracking-tight uppercase">Генератор паролей</h1>
                    <p class="text-xs text-slate-500">Создание криптоустойчивых паттернов</p>
                </div>

                <div class="space-y-4">
                    <div class="p-5 bg-slate-100 dark:bg-brandDark rounded-2xl border border-slate-200 dark:border-white/5 flex flex-col items-center justify-center relative min-h-[70px]">
                        <span id="password-display" class="font-mono text-base tracking-wider text-slate-800 dark:text-white select-all">••••••••••••••••</span>
                        <span id="copy-message" class="text-[9px] text-emerald-500 dark:text-emerald-400 font-bold uppercase tracking-widest mt-1 absolute bottom-1"></span>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">Ключевое слово (Опционально)</label>
                        <input type="text" id="keyword-input" class="w-full px-4 py-3 bg-slate-100 dark:bg-brandDark border border-slate-200 dark:border-white/10 rounded-xl outline-none focus:border-red-600 transition-all font-mono text-sm" placeholder="Например: barsik">
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button id="generate-btn" class="flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl shadow-lg transition-all active:scale-95 uppercase tracking-wider text-xs">
                            Генерировать
                        </button>
                        <button id="copy-btn" class="flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl shadow-lg transition-all active:scale-95 uppercase tracking-wider text-xs">
                            Копировать
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="border-t border-slate-200 dark:border-white/5 bg-white dark:bg-brandCard mt-24 py-8 px-6 text-center text-xs text-slate-500 w-full">
        <div class="max-w-xl mx-auto space-y-4">
            <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 font-bold uppercase tracking-wider text-[10px]">
                <a href="/" class="hover:text-red-600 transition-colors">Главная</a>
                <a href="/generator" class="text-red-600 transition-colors">Генератор</a>
                <a href="/about" class="hover:text-red-600 transition-colors">О нас</a>
                <a href="/support" class="hover:text-red-600 transition-colors">Поддержка</a>
                <a href="/faq" class="hover:text-red-600 transition-colors">FAQ</a>
                <a href="/privacy" class="hover:text-red-600 transition-colors">Конфиденциальность</a>
            </div>
            <p class="tracking-wide text-slate-400 dark:text-slate-600">© RedPass 2026 R. Все права защищены.</p>
        </div>
    </footer>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // Скрипт генератора
        const keywordInput = document.getElementById('keyword-input');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const passwordDisplay = document.getElementById('password-display');
        const copyMessage = document.getElementById('copy-message');

        const charset = { upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", digits: "0123456789", symbols: "!@#$%^&*()_+" };
        function getRandom(str) { return str[Math.floor(Math.random() * str.length)]; }
        function leetify(text) { return text.toLowerCase().replace(/a/g, '4').replace(/e/g, '3').replace(/i/g, '1').replace(/o/g, '0').replace(/s/g, '5').replace(/t/g, '7'); }

        function generateSecurePassword(keyword) {
            let base = keyword ? leetify(keyword.trim()) : "";
            const minTotalLength = 16;
            let securePrefix = getRandom(charset.upper) + getRandom(charset.symbols) + getRandom(charset.digits);
            let secureSuffix = getRandom(charset.digits) + getRandom(charset.symbols) + getRandom(charset.upper);
            let result = Math.random() > 0.5 ? securePrefix + base + secureSuffix : base.slice(0, Math.floor(base.length/2)) + securePrefix + secureSuffix + base.slice(Math.floor(base.length/2));
            const allChars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
            while (result.length < minTotalLength) { result += getRandom(allChars); }
            return result;
        }

        generateBtn.addEventListener('click', () => { passwordDisplay.innerText = generateSecurePassword(keywordInput.value); passwordDisplay.classList.remove('text-slate-800', 'dark:text-white'); passwordDisplay.classList.add('text-red-600'); });
        copyBtn.addEventListener('click', async () => { const pass = passwordDisplay.innerText; if (pass.includes('•')) return; try { await navigator.clipboard.writeText(pass); copyMessage.innerText = 'Пароль скопирован!'; setTimeout(() => copyMessage.innerText = '', 2000); } catch (e) {} });
    </script>
</body>
</html>
